name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish GitHub release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run tests and build plugin
        run: ./gradlew clean test build --no-daemon

      - name: Verify release version and create checksum
        id: artifact
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          jar="build/libs/chunk-mob-challenge-${version}.jar"

          if [[ ! -f "${jar}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the built plugin version."
            echo "::error::Expected artifact: ${jar}"
            exit 1
          fi

          checksum="${jar}.sha256"
          sha256sum "${jar}" > "${checksum}"

          {
            echo "version=${version}"
            echo "jar=${jar}"
            echo "checksum=${checksum}"
          } >> "${GITHUB_OUTPUT}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.artifact.outputs.version }}
          JAR: ${{ steps.artifact.outputs.jar }}
          CHECKSUM: ${{ steps.artifact.outputs.checksum }}
        shell: bash
        run: |
          release_args=(
            "${GITHUB_REF_NAME}"
            "${JAR}"
            "${CHECKSUM}"
            --title "Chunk Mob Challenge ${GITHUB_REF_NAME}"
          )

          notes_file="docs/release-notes/${VERSION}.md"
          if [[ -f "${notes_file}" ]]; then
            release_args+=(--notes-file "${notes_file}")
          else
            release_args+=(--generate-notes)
          fi

          if [[ "${VERSION}" == *-* ]]; then
            release_args+=(--prerelease)
          fi

          gh release create "${release_args[@]}"
